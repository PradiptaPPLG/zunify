name: zunify
description: "Zunify — A modern music streaming application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2803.0

  # Routing
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Audio
  just_audio: ^0.9.44
  audio_service: ^0.18.16
  just_audio_background: ^0.0.1-beta.13

  # Image
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+3

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/zunify.png"
  web:
    generate: true
    image_path: "assets/images/zunify.png"
    background_color: "#FFFFFF"
